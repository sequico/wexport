[package]
name = "wexport"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Sequi Company <info@sequi.company>"]
homepage = "https://sequi.company"
license = "GPL-3.0-or-later"
description = "WhatsApp backups (Android and iPhone) to self-contained offline chat archives"
repository = "https://github.com/sequico/wexport"
readme = "README.md"
keywords = ["whatsapp", "backup", "archive", "offline", "iphone"]
categories = ["command-line-utilities"]

[lib]
name = "wexport"
path = "src/lib.rs"

[[bin]]
name = "wexport"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
flate2 = "1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
jiff = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
openh264 = "0.9.10"
opus = "0.4.0"
plist = "1.10.4"

[profile.release]
strip = true
opt-level = "s"
lto = true

# The gate, in the manifest: a warning is a failure, in rustc, in rustdoc and in clippy.
[lints.rust]
warnings = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = "deny"

[dev-dependencies]
proptest = "1"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
