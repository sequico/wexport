[package]
name = "wexport"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
description = "Android WhatsApp crypt15 backup to self-contained offline chat archives"
repository = "https://github.com/sequico/wexport"
readme = "README.md"
keywords = ["whatsapp", "backup", "archive", "offline", "crypt15"]
categories = ["command-line-utilities"]

[lib]
name = "wexport"
path = "src/lib.rs"

[[bin]]
name = "wexport"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
flate2 = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[profile.release]
strip = true
opt-level = "s"
lto = true
