# The push gate, on every pull request and every push to main.
#
# Same script a release runs first, so a red check here is the same failure a push would hit:
# format, lints, the test suite, the dependency gate and the Windows cross-check. Mutation testing,
# fuzzing and ThreadSanitizer stay in scripts/gate-release.sh: they cost minutes, not seconds.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest,cargo-deny
      - name: ffmpeg, ffprobe and the Windows linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg gcc-mingw-w64-x86-64
      - name: Windows target
        run: rustup target add x86_64-pc-windows-gnu
      - name: gate
        run: ./scripts/gate.sh
