# The dependency gate: what may enter the tree, and what must never leave it.
#
# Run with `cargo deny check`. Licences are checked against GPL-3.0-or-later compatibility: a
# permissive licence is fine, a copyleft one has to be compatible, and anything unknown fails.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # our own crate, and the licence the whole tree is under
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
