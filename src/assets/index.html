<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div id="heading">
    <h1 id="title">…</h1>
    <p id="subtitle"></p>
  </div>
  <div id="tools">
    <input id="q" type="search" aria-label="Search this chat" placeholder="Search this chat, then Enter" autocomplete="off">
    <input id="date" type="date" aria-label="Jump to a date" title="Jump to a date">
  </div>
  <div id="hits" hidden></div>
</header>
<main id="timeline" tabindex="0" aria-label="Messages">
  <div id="rows"></div>
  <div id="status" role="status"></div>
</main>
<script>
/* The bootstrap the archive needs: manifest.js and the data chunks call these globals.
   Classic script on purpose — file:// blocks modules, fetch and workers. */
window.WEX = { chunks: {}, manifestData: null };
WEX.manifest = function (m) { this.manifestData = m; };
WEX.chunk = function (name, messages) { this.chunks[name] = messages; };
</script>
<script src="data/manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
