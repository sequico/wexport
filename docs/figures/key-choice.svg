<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" role="img" aria-labelledby="key-choice-title">
  <title id="key-choice-title">Turning on end-to-end encrypted backup: the passkey button, More options, and Use 64-digit encryption key instead</title>
  <style>
    .phone { fill: #ffffff; stroke: #cfd6dd; stroke-width: 2; }
    .bar { fill: #075e54; }
    .title { fill: #ffffff; font: 600 15px system-ui, sans-serif; }
    .clock { fill: #8696a0; font: 12px system-ui, sans-serif; }
    .body { fill: #111b21; font: 14px system-ui, sans-serif; }
    .small { fill: #667781; font: 12px system-ui, sans-serif; }
    .chev { fill: none; stroke: #8696a0; stroke-width: 2; }
    .primary { fill: #00a884; }
    .primaryText { fill: #ffffff; font: 600 14px system-ui, sans-serif; }
    .link { fill: #00a884; font: 600 14px system-ui, sans-serif; }
    .sheet { fill: #f7f9fa; stroke: #e6ebee; stroke-width: 1; }
    .option { fill: #111b21; font: 14px system-ui, sans-serif; }
    .optionPick { fill: #007f6c; font: 600 13px system-ui, sans-serif; }
    .mark { fill: #e7f6f1; }
    .callout { fill: #00a884; }
    .calloutText { fill: #ffffff; font: 700 12px system-ui, sans-serif; }
  </style>

  <rect class="phone" x="20" y="20" width="320" height="600" rx="26"/>
  <text class="clock" x="44" y="42">9:41</text>
  <rect x="286" y="32" width="18" height="9" rx="2" fill="none" stroke="#8696a0" stroke-width="1.5"/>
  <rect x="288" y="34" width="12" height="5" fill="#8696a0"/>

  <rect class="bar" x="20" y="48" width="320" height="56"/>
  <path class="chev" d="M40 84 L30 76 L40 68"/>
  <text class="title" x="56" y="82">End-to-end encrypted backup</text>

  <text class="body" x="40" y="140">Protect your backup with a passkey,</text>
  <text class="body" x="40" y="160">a password, or a 64-digit key.</text>
  <text class="small" x="40" y="184">WhatsApp offers the passkey first.</text>

  <rect class="primary" x="52" y="216" width="256" height="48" rx="24"/>
  <text class="primaryText" x="180" y="246" text-anchor="middle">Create a passkey</text>

  <text class="link" x="180" y="300" text-anchor="middle">More options</text>

  <path d="M22 368 A16 16 0 0 1 38 352 H322 A16 16 0 0 1 338 368 V616 H22 Z" fill="#f7f9fa" stroke="#e6ebee" stroke-width="1"/>
  <text class="small" x="44" y="388">More options</text>

  <text class="option" x="44" y="432">Use password</text>
  <line x1="44" y1="452" x2="316" y2="452" stroke="#e6ebee" stroke-width="1"/>

  <rect class="mark" x="34" y="464" width="292" height="48" rx="10"/>
  <text class="optionPick" x="48" y="494">Use 64-digit encryption key instead</text>

  <line x1="44" y1="528" x2="316" y2="528" stroke="#e6ebee" stroke-width="1"/>
  <text class="small" x="44" y="560">Cancel</text>

  <circle class="callout" cx="360" cy="300" r="13"/>
  <text class="calloutText" x="360" y="305" text-anchor="middle">1</text>
  <circle class="callout" cx="360" cy="488" r="13"/>
  <text class="calloutText" x="360" y="493" text-anchor="middle">2</text>
</svg>
