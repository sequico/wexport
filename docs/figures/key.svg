<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" role="img" aria-labelledby="key-title">
  <title id="key-title">The 64-digit encryption key screen: four rows of four groups of four hex digits</title>
  <style>
    .phone { fill: #ffffff; stroke: #cfd6dd; stroke-width: 2; }
    .bar { fill: #075e54; }
    .title { fill: #ffffff; font: 600 16px system-ui, sans-serif; }
    .clock { fill: #8696a0; font: 12px system-ui, sans-serif; }
    .body { fill: #111b21; font: 14px system-ui, sans-serif; }
    .small { fill: #667781; font: 12px system-ui, sans-serif; }
    .chev { fill: none; stroke: #8696a0; stroke-width: 2; }
    .keyBox { fill: #f7f9fa; stroke: #e6ebee; stroke-width: 1; }
    .key { fill: #111b21; font: 600 17px ui-monospace, "DejaVu Sans Mono", monospace; letter-spacing: 1.5px; }
    .primary { fill: #00a884; }
    .primaryText { fill: #ffffff; font: 600 14px system-ui, sans-serif; }
    .callout { fill: #00a884; }
    .calloutText { fill: #ffffff; font: 700 12px system-ui, sans-serif; }
  </style>

  <rect class="phone" x="20" y="20" width="320" height="600" rx="26"/>
  <text class="clock" x="44" y="42">9:41</text>
  <rect x="286" y="32" width="18" height="9" rx="2" fill="none" stroke="#8696a0" stroke-width="1.5"/>
  <rect x="288" y="34" width="12" height="5" fill="#8696a0"/>

  <rect class="bar" x="20" y="48" width="320" height="56"/>
  <path class="chev" d="M40 84 L30 76 L40 68"/>
  <text class="title" x="56" y="82">Your encryption key</text>

  <text class="body" x="40" y="140">These 64 digits are the only way to</text>
  <text class="body" x="40" y="160">read this backup. Write them down, or</text>
  <text class="body" x="40" y="180">take a screenshot, before you close it.</text>
  <text class="small" x="40" y="204">WhatsApp shows them once and keeps no copy.</text>

  <rect class="keyBox" x="40" y="228" width="280" height="200" rx="12"/>
  <text class="key" x="180" y="280" text-anchor="middle">3f9a 7c21 04bd e8f5</text>
  <text class="key" x="180" y="320" text-anchor="middle">6d10 92b7 5ace 34f8</text>
  <text class="key" x="180" y="360" text-anchor="middle">b0c4 1e7d 8a35 f62b</text>
  <text class="key" x="180" y="400" text-anchor="middle">d5e8 4f09 7b26 c1a3</text>

  <text class="small" x="40" y="456">16 groups of 4 hex digits, 32 bytes in all.</text>

  <rect class="primary" x="52" y="496" width="256" height="48" rx="24"/>
  <text class="primaryText" x="180" y="526" text-anchor="middle">Done</text>

  <text class="small" x="40" y="580">Store it away from the phone as well.</text>

  <circle class="callout" cx="360" cy="328" r="13"/>
  <text class="calloutText" x="360" y="333" text-anchor="middle">3</text>
</svg>
