<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" role="img" aria-labelledby="chat-backup-title">
  <title id="chat-backup-title">The Chat backup screen: the End-to-end encrypted backup row and the Back up now button</title>
  <style>
    .phone { fill: #ffffff; stroke: #cfd6dd; stroke-width: 2; }
    .bar { fill: #075e54; }
    .title { fill: #ffffff; font: 600 16px system-ui, sans-serif; }
    .clock { fill: #8696a0; font: 12px system-ui, sans-serif; }
    .label { fill: #111b21; font: 14px system-ui, sans-serif; }
    .value { fill: #667781; font: 13px system-ui, sans-serif; }
    .section { fill: #667781; font: 600 10px system-ui, sans-serif; letter-spacing: .1em; }
    .rule { stroke: #e6ebee; stroke-width: 1; }
    .chev { fill: none; stroke: #8696a0; stroke-width: 2; }
    .toggle { fill: #dfe5e7; }
    .knob { fill: #ffffff; }
    .button { fill: none; stroke: #00a884; stroke-width: 2; }
    .buttonText { fill: #00a884; font: 600 14px system-ui, sans-serif; }
    .mark { fill: #e7f6f1; }
    .callout { fill: #00a884; }
    .calloutText { fill: #ffffff; font: 700 12px system-ui, sans-serif; }
  </style>

  <rect class="phone" x="20" y="20" width="320" height="600" rx="26"/>
  <text class="clock" x="44" y="42">9:41</text>
  <rect x="286" y="32" width="18" height="9" rx="2" fill="none" stroke="#8696a0" stroke-width="1.5"/>
  <rect x="288" y="34" width="12" height="5" fill="#8696a0"/>

  <rect class="bar" x="20" y="48" width="320" height="56"/>
  <path class="chev" d="M40 84 L30 76 L40 68"/>
  <text class="title" x="56" y="82">Chat backup</text>

  <text class="section" x="40" y="130">BACKUP TO YOUR GOOGLE ACCOUNT</text>

  <text class="label" x="40" y="170">Auto backup</text>
  <text class="value" x="320" y="170" text-anchor="end">Off</text>
  <line class="rule" x1="40" y1="192" x2="320" y2="192"/>

  <text class="label" x="40" y="226">Back up using cellular</text>
  <rect class="toggle" x="276" y="210" width="44" height="24" rx="12"/>
  <circle class="knob" cx="288" cy="222" r="10"/>
  <line class="rule" x1="40" y1="248" x2="320" y2="248"/>

  <text class="label" x="40" y="282">Include videos</text>
  <rect class="toggle" x="276" y="266" width="44" height="24" rx="12"/>
  <circle class="knob" cx="288" cy="278" r="10"/>
  <line class="rule" x1="40" y1="304" x2="320" y2="304"/>

  <rect class="mark" x="20" y="304" width="320" height="58"/>
  <text class="label" x="40" y="340">End-to-end encrypted backup</text>
  <text class="value" x="308" y="340" text-anchor="end">Off</text>
  <path class="chev" d="M318 332 L326 340 L318 348"/>

  <text class="section" x="40" y="392">BACKUP</text>
  <rect class="button" x="62" y="404" width="236" height="48" rx="24"/>
  <text class="buttonText" x="180" y="434" text-anchor="middle">Back up now</text>

  <text class="value" x="40" y="486">Last backup: 2 Dec 2026, 12:00</text>

  <text class="section" x="40" y="530">ACCOUNT</text>
  <text class="label" x="40" y="566">Backup provider</text>
  <text class="value" x="308" y="566" text-anchor="end">Google Drive</text>
  <path class="chev" d="M318 558 L326 566 L318 574"/>

  <circle class="callout" cx="360" cy="333" r="13"/>
  <text class="calloutText" x="360" y="338" text-anchor="middle">1</text>
  <circle class="callout" cx="360" cy="428" r="13"/>
  <text class="calloutText" x="360" y="433" text-anchor="middle">2</text>
</svg>
